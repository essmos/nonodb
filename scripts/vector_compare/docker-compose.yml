services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: vector-compare-qdrant
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: vector-compare-elasticsearch
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
