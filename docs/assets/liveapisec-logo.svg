<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none" role="img" aria-label="LiveAPISec">
  <title>LiveAPISec</title>
  <style>
    @keyframes las-ping {
      0%   { transform: scale(0.35); opacity: 0.9; }
      70%  { transform: scale(2.1);  opacity: 0; }
      100% { transform: scale(2.1);  opacity: 0; }
    }
    @keyframes las-dot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
    .las-ring, .las-ring-delay {
      transform-box: fill-box;
      transform-origin: center;
      animation: las-ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .las-ring-delay { animation-delay: 1.5s; }
    .las-dot { animation: las-dot 3s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="las-bg" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="38" height="38" rx="9.5" fill="url(#las-bg)"/>

  <path d="M20 5.6 L31.6 9.8 V20.6 C31.6 27.3 26.8 31.2 20 33.2 C13.2 31.2 8.4 27.3 8.4 20.6 V9.8 Z"
        fill="rgba(255,255,255,0.14)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>

  <path d="M15.6 20.9 L19.2 24.5 L25.2 16.9"
        stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <circle class="las-ring" cx="30.4" cy="9.6" r="3.1" stroke="#fff" stroke-width="1.6"/>
  <circle class="las-ring-delay" cx="30.4" cy="9.6" r="3.1" stroke="#fff" stroke-width="1.6"/>
  <circle class="las-dot" cx="30.4" cy="9.6" r="2.3" fill="#fff"/>
</svg>
