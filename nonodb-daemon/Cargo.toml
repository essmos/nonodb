[package]
name = "nonodb-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nonodb-auth = { path = "../nonodb-auth" }
nonodb-core = { path = "../nonodb-core" }
axum = { version = "0.7", features = ["tokio", "json"] }
base64 = "0.23"
bson = { version = "3.1", default-features = false, features = ["serde", "compat-3-0-0"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
md5 = "0.7"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "signal",
    "sync",
    "time",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "blocking"] }
tokio-util = { version = "0.7", features = ["io"] }
time = { version = "0.3", features = ["formatting"] }
serde.workspace = true
serde_json.workspace = true
subtle = "2"
ipnet = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
x509-parser = "0.18"
zeroize = "1"
ring = "0.17"

[dev-dependencies]
tempfile = "3"
