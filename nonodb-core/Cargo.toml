[package]
name = "nonodb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
heed = "0.20"
memchr = "2"
base64 = "0.23"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
serde.workspace = true
serde_json.workspace = true
sonic-rs = "0.5"
unicode-normalization = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3.55", features = ["parsing"] }
bson = { version = "3.1.0", default-features = false, features = ["serde", "compat-3-0-0"] }
bigdecimal = "0.4.11"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
proptest = "1"
