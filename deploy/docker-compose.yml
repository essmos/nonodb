services:
  nonodb:
    image: ${NONODB_IMAGE:-ghcr.io/essmos/nonodb:0.13.0}
    container_name: nonodb
    restart: unless-stopped
    environment:
      NONODB_AUTH_FILE: "/run/secrets/nonodb_auth"
      NONODB_TCP: "0.0.0.0:7878"
      RUST_LOG: "info"
    ports:
      - "127.0.0.1:7878:7878"
    secrets:
      - nonodb_auth
    volumes:
      - nonodb-data:/var/lib/nonodb
      - nonodb-run:/run/nonodb

secrets:
  nonodb_auth:
    file: "${NONODB_AUTH_FILE:?Set NONODB_AUTH_FILE to an auth.json path}"

volumes:
  nonodb-data:
  nonodb-run:
