services:
  nonodb:
    image: ${NONODB_IMAGE:-ghcr.io/essmos/nonodb:0.21.0}
    container_name: nonodb
    restart: unless-stopped
    environment:
      NONODB_AUTH_FILE: "/run/secrets/nonodb_auth"
      NONODB_TCP: "0.0.0.0:7878"
      RUST_LOG: "info"
    ports:
      - "127.0.0.1:7878:7878"
    secrets:
      - nonodb_auth
    volumes:
      - nonodb-data:/var/lib/nonodb
      - nonodb-run:/run/nonodb

  nonodb-gui:
    image: ${NONODB_IMAGE:-ghcr.io/essmos/nonodb:0.21.0}
    container_name: nonodb-gui
    profiles: ["gui"]
    restart: unless-stopped
    command:
      - nonodb-cli
      - gui
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --allow-remote
      - --no-open
    environment:
      NONODB_SOCK: "/run/nonodb/nonodb.sock"
      RUST_LOG: "info"
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - nonodb
    volumes:
      - nonodb-run:/run/nonodb

secrets:
  nonodb_auth:
    file: "${NONODB_AUTH_FILE:?Set NONODB_AUTH_FILE to an auth.json path}"

volumes:
  nonodb-data:
  nonodb-run:
