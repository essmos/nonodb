name: Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to publish, e.g. v0.9.0; empty uses the selected ref"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_TAG}"
          if [[ -z "${TAG}" && "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ -n "${TAG}" && ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          REVISION="$(git rev-parse HEAD)"
          TAGS="${IMAGE}:sha-${REVISION:0:12}"
          VERSION="sha-${REVISION:0:12}"

          if [[ -n "${TAG}" ]]; then
            VERSION="${TAG#v}"
            TAGS="${IMAGE}:${VERSION}"

            # Only stable releases move major.minor and latest.
            if [[ "${VERSION}" != *-* ]]; then
              MINOR="${VERSION%.*}"
              TAGS="${TAGS},${IMAGE}:${MINOR},${IMAGE}:latest"
            fi
          fi

          {
            echo "tags=${TAGS}"
            echo "version=${VERSION}"
            echo "revision=${REVISION}"
          } >> "${GITHUB_OUTPUT}"

          echo "Publishing ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
