name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build GUI
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release binaries and examples
        run: cargo build --locked --release --bins --examples

      - name: Check Python syntax
        run: python3 -m compileall -q client scripts

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check httpx

      - name: Check Node.js client
        run: |
          node --check client/node/index.js
          node --check client/node/smoke_test.js

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test Go client
        working-directory: client/go
        run: |
          go test ./...
          go vet ./...

      - name: Run client integration smoke tests
        run: bash scripts/clients_test.sh

      - name: Run multi-database, GUI, and live-stream tests
        env:
          NONODB_BIN: target/release/nonodb-daemon
          NONODB_DAEMON: target/release/nonodb-daemon
          NONODB_CLI: target/release/nonodb-cli
        run: |
          python3 scripts/multi_database_test.py
          python3 scripts/multi_database_features_test.py
          python3 scripts/durability_test.py
          python3 scripts/gui_test.py
          python3 scripts/live_watch_test.py

      - name: Run security regression checks
        env:
          NONODB_DAEMON: target/release/nonodb-daemon
          NONODB_CLI: target/release/nonodb-cli
        run: python3 scripts/security_check.py

  gui:
    name: Build GUI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install and build
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build

  cross-platform:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check macOS/Windows build
        run: cargo check --locked --all-targets --all-features
