name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build GUI
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Test Linux FICLONE branch method
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs
          truncate -s 256M /tmp/nonodb-btrfs.img
          sudo mkfs.btrfs -f -q /tmp/nonodb-btrfs.img
          sudo mkdir -p /mnt/nonodb-btrfs
          sudo mount -o loop /tmp/nonodb-btrfs.img /mnt/nonodb-btrfs
          sudo chown "$USER":"$(id -gn)" /mnt/nonodb-btrfs
          NONODB_TEST_REFLINK_DIR=/mnt/nonodb-btrfs cargo test --locked -p nonodb-cli branch::tests::linux_reflink_is_used -- --nocapture

      - name: Build release binaries and examples
        run: cargo build --locked --release --bins --examples

      - name: Check Python syntax
        run: python3 -m compileall -q client scripts

      - name: Check MongoDB portability checker
        run: python3 scripts/mongo_portability_check.py --self-test

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check httpx

      - name: Install Playwright browser
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Check client routing
        run: |
          python3 client/routing_test.py
          node --check client/node/index.js
          node --check client/node/smoke_test.js
          node client/node/routing_test.js

      - name: Build and test Python package
        run: |
          python3 -m pip install --disable-pip-version-check build
          rm -rf dist
          python3 -m build client --outdir dist
          python3 scripts/python_package_test.py --dist dist

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test Go client
        working-directory: client/go
        run: |
          go test ./...
          go vet ./...

      - name: Build debug binaries for integration tests
        run: cargo build --locked --bins

      - name: Run read-only openCypher TCK baseline
        run: |
          scripts/fetch-opencypher-tck.sh /tmp/opencypher-tck
          python3 scripts/cypher_tck.py             --tck-dir /tmp/opencypher-tck             --daemon target/debug/nonodb-daemon             --output tck-report.json
          python3 - <<'PY'
          import json
          report = json.load(open("tck-report.json"))
          assert report["pass_rate"] >= 0.90, report["pass_rate"]
          assert report["counts"]["known_gap"] == 0, report["counts"]
          assert report["counts"]["pass"] + report["counts"]["known_gap"] + report["counts"]["unsupported"] == report["total"]
          PY

      - name: Test MongoDB wire limits
        run: python3 scripts/mongo_wire_limits_test.py

      - name: Run client integration smoke tests
        run: bash scripts/clients_test.sh

      - name: Run multi-database, GUI, and live-stream tests
        env:
          NONODB_BIN: target/release/nonodb-daemon
          NONODB_DAEMON: target/release/nonodb-daemon
          NONODB_CLI: target/release/nonodb-cli
        run: |
          python3 scripts/multi_database_test.py
          python3 scripts/multi_database_features_test.py
          python3 scripts/durability_test.py
          python3 scripts/graph_test.py
          python3 scripts/graph_auth_test.py
          python3 scripts/graph_jobs_test.py
          python3 scripts/graph_property_test.py
          python3 scripts/graph_crash_test.py
          python3 scripts/graph_rebuild_crash_test.py
          python3 scripts/graph_replication_test.py
          python3 scripts/gui_test.py
          python3 scripts/gui_views_test.py
          python3 scripts/gui_graph_test.py
          python3 scripts/live_watch_test.py
          python3 scripts/async_watch_test.py
          python3 scripts/auth_api_test.py
          python3 scripts/revocation_test.py
          python3 scripts/backup_api_test.py
          python3 scripts/replication_control_plane_test.py
          python3 scripts/replication_discovery_test.py
          python3 scripts/replication_lease_gate_test.py
          python3 scripts/replication_partition_test.py
          python3 scripts/replication_vault_test.py
          python3 scripts/restore_to_test.py
          python3 scripts/pitr_test.py
          python3 scripts/quota_test.py
          python3 scripts/restore_in_place_test.py
          python3 scripts/branch_test.py
          python3 scripts/webhook_test.py
          python3 scripts/search_all_test.py
          python3 scripts/search_bench.py
          python3 scripts/ttl_strict_test.py
          python3 scripts/ttl_strict_disabled_test.py
          python3 scripts/ttl_replica_strict_test.py
          python3 scripts/events_ttl_test.py

      - name: Run security regression checks
        env:
          NONODB_DAEMON: target/release/nonodb-daemon
          NONODB_CLI: target/release/nonodb-cli
        run: python3 scripts/security_check.py

  mongodb-compat:
    name: MongoDB compatibility
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      NONODB_MONGO_URL: mongodb://127.0.0.1:37017/?directConnection=true
      MONGODB_CONFORMANCE_URL: mongodb://127.0.0.1:27017/?directConnection=true

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Python MongoDB driver and client dependencies
        run: python3 -m pip install --disable-pip-version-check pymongo httpx

      - name: Build daemon
        run: cargo build --locked --bins

      - name: Start NonoDB MongoDB listener
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nonodb-mongo/data"
          NONODB_DATA="$RUNNER_TEMP/nonodb-mongo/data" \
          NONODB_SOCK="$RUNNER_TEMP/nonodb-mongo/nonodb.sock" \
          NONODB_MONGO_ADDR=127.0.0.1:37017 \
            target/debug/nonodb-daemon >"$RUNNER_TEMP/nonodb-mongo/daemon.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/nonodb-mongo/pid"
          python3 - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 37017), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("NonoDB MongoDB listener did not start")
          PY

      - name: Run MongoDB conformance and wire smoke tests
        run: |
          python3 scripts/mongo_conformance_test.py
          python3 scripts/mongo_wire_test.py
          python3 scripts/search_all_test.py

      - name: Run MongoDB DDL translation tests
        env:
          NONODB_SOCK: ${{ runner.temp }}/nonodb-mongo/nonodb.sock
        run: python3 scripts/mongo_ddl_test.py

      - name: Run MongoDB TTL restart test
        run: python3 scripts/mongo_ttl_restart_test.py

      - name: Run MongoDB migration tool test
        env:
          NONODB_SOCK: ${{ runner.temp }}/nonodb-mongo/nonodb.sock
          MONGODB_MIGRATE_URL: mongodb://127.0.0.1:27017/?directConnection=true
        run: python3 scripts/nonodb_migrate_test.py

      - name: Run MongoDB shadow mode test
        env:
          NONODB_DAEMON: target/debug/nonodb-daemon
          MONGODB_SHADOW_URL: mongodb://127.0.0.1:27017/?directConnection=true
        run: python3 scripts/mongo_shadow_test.py

      - name: Run official Node.js and Go MongoDB drivers
        run: bash scripts/mongo_drivers_test.sh

      - name: Run MongoDB auth and authorization tests
        run: python3 scripts/mongo_wire_auth_test.py

      - name: Stop NonoDB MongoDB listener
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nonodb-mongo/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/nonodb-mongo/pid")" 2>/dev/null || true
          fi

  gui:
    name: Build GUI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install and build
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build

  cross-platform:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check macOS/Windows build
        run: cargo check --locked --all-targets --all-features

      - name: Test APFS clonefile branch method
        if: runner.os == 'macOS'
        run: cargo test --locked -p nonodb-cli branch::tests::apfs_clonefile_is_used -- --nocapture
