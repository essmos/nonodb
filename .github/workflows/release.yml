name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.11.0 or v0.11.0-beta.1"
        required: true
        type: string
        default: "v0.11.0"
      summary:
        description: "Short summary for the release title: vX.Y.Z - <summary>"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SUMMARY_INPUT: ${{ github.event.inputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${TAG}" =~ ^v[0-9] ]]; then
            echo "Release tag must start with 'v' followed by a version, got: ${TAG}" >&2
            exit 1
          fi

          PRE="${{ github.event.inputs.prerelease || 'false' }}"
          DRAFT="${{ github.event.inputs.draft || 'false' }}"

          # Tags such as v0.4.0-beta.1 or v0.4.0-rc.1 are pre-releases
          # automatically, even when the flag was not set manually.
          if [[ "${TAG}" == *-* ]]; then
            PRE=true
          fi

          # actions/checkout rewrites the tag ref to a lightweight tag.
          # Fetch the annotated tag object again so its subject can be used
          # as the release title summary.
          if ! git cat-file -e "refs/tags/${TAG}^{tag}" 2>/dev/null; then
            git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1 || true
          fi

          SUMMARY="${SUMMARY_INPUT}"
          if [[ -z "${SUMMARY}" ]] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            SUMMARY="$(git tag -l --format='%(contents:subject)' "${TAG}")"
            SUMMARY="${SUMMARY#"${TAG}"}"
            SUMMARY="$(printf '%s' "${SUMMARY}" | sed -E 's/^[[:space:]]*[-—:][[:space:]]*//')"
          fi
          if [[ -z "${SUMMARY}" ]]; then
            SUMMARY="Release"
          fi
          TITLE="${TAG} - ${SUMMARY}"

          {
            echo "tag=${TAG}"
            echo "title=${TITLE}"
            echo "prerelease=${PRE}"
            echo "draft=${DRAFT}"
          } >> "${GITHUB_OUTPUT}"

          echo "Releasing ${TAG} as '${TITLE}' (prerelease=${PRE}, draft=${DRAFT})"

  test:
    name: Test on Linux
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  build:
    name: Build ${{ matrix.asset }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${TARGET}" \
            --bin nonodb-daemon --bin nonodb-cli

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="nonodb-${TAG}-${ASSET}"
          STAGE="dist/${ARCHIVE}"
          EXE=""
          if [[ "${TARGET}" == *windows* ]]; then
            EXE=".exe"
          fi

          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/nonodb-daemon${EXE}" "${STAGE}/"
          cp "target/${TARGET}/release/nonodb-cli${EXE}" "${STAGE}/"
          cp README.md LICENSE "${STAGE}/"
          cp -R docs "${STAGE}/docs"

          if [[ "${TARGET}" == *windows* ]]; then
            export ARCHIVE
            powershell -NoProfile -Command '$a=$env:ARCHIVE; Compress-Archive -Path "dist/$a" -DestinationPath "dist/$a.zip"; $h=(Get-FileHash -Algorithm SHA256 "dist/$a.zip").Hash.ToLower(); [System.IO.File]::WriteAllText("dist/$a.zip.sha256", "$h  $a.zip`n", [System.Text.Encoding]::ASCII)'
          else
            tar -C dist -czf "dist/${ARCHIVE}.tar.gz" "${ARCHIVE}"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256")
            else
              (cd dist && shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256")
            fi
          fi

          ls -lh dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: nonodb-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TITLE: ${{ needs.prepare.outputs.title }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail

          PRE="${{ needs.prepare.outputs.prerelease }}"
          DRAFT="${{ needs.prepare.outputs.draft }}"
          ASSETS=(dist/*.tar.gz dist/*.zip dist/*.sha256)

          # Prefer substantive release notes from the annotated tag body.
          if ! git cat-file -e "refs/tags/${TAG}^{tag}" 2>/dev/null; then
            git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1 || true
          fi
          NOTES="$(git tag -l --format='%(contents:body)' "${TAG}")"
          NOTES_FLAGS=(--generate-notes)
          if [[ -n "${NOTES//[[:space:]]/}" ]]; then
            printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"
            NOTES_FLAGS=(--notes-file "${RUNNER_TEMP}/release-notes.md")
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber."
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            FLAGS=()
            if [[ "${PRE}" == "true" ]]; then
              FLAGS+=(--prerelease)
            fi
            if [[ "${DRAFT}" == "true" ]]; then
              FLAGS+=(--draft)
            fi

            gh release create "${TAG}" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              "${NOTES_FLAGS[@]}" \
              "${FLAGS[@]}"
          fi
