name: Python package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built package to PyPI (requires trusted publishing)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check build twine "setuptools>=77" wheel

      - name: Build wheel and sdist
        run: python -m build client --outdir dist

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Test clean virtualenv install
        run: python scripts/python_package_test.py --dist dist

      - name: Upload distribution files
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nonodb-client
    permissions:
      id-token: write
    steps:
      - name: Download distribution files
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
